# The build only runs under qemu on a 3 GB host, so every JVM stays small:
# Gradle 1.2 GB, Kotlin compiler 1 GB, one worker, no parallel tasks. Bigger
# heaps get OOM-killed mid-dex.
org.gradle.jvmargs=-Xmx1200m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvm.options=-Xmx1000m
kotlin.compiler.execution.strategy=daemon
